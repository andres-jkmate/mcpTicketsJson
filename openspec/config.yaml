schema: spec-driven

context: |
  Language: es
  All artifacts must be written in es.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  ## Repo
  Monorepo (npm workspaces, sin Nx) de los MCPs de JKMate v2 para agentes, separado de `jkmate-mcp`.
  Mapa de apps y paquetes, y comandos: `README.md`.
  - `apps/<nombre>-mcp`: un MCP por carpeta. Hoy `apps/tickets-mcp`; los nuevos se copian de
    `apps/_template-mcp` (ver su README).
  - `packages/core` y `packages/firebird`: lo común. Un MCP no reimplementa lo que ya dan
    (validación, errores, log, servidor, acceso a Firebird); si falta algo, se suma al paquete.
  - TypeScript, transporte stdio, Pino hacia Seq, Vitest.

  ## Base de datos
  - Firebird 3.x con `node-firebird` y charset UTF8. La lógica y la forma de los datos viven en SP
    para agentes; convenciones en el hub JKMate-Knowledge `firebird/convenciones.md`.
  - Nunca ejecutar DDL sin confirmación explícita. Los SP nuevos se proponen en el design.md; una vez
    aplicados se versionan en `apps/<mcp>/db/procedimientos/` (ver `apps/tickets-mcp/db/README.md`).
  - `conocimiento-jkmate-mcp` sirve de referencia, pero no refleja la base de tickets: los SP reales
    los confirma el usuario.

  ## Diseño de tools
  - Nombres en español, snake_case, verbo_sustantivo. Pocas tools compuestas.
  - `outputSchema` + `structuredContent`; `content` con un resumen y el mismo JSON (sin escapado Unicode).
  - Campos camelCase, solo lo que un agente necesita, tipos consistentes (booleanos reales, fechas
    ISO 8601 con offset). Listados sin textos largos, paginados y con total.
  - El usuario que llama sale de `MCP_COD_USUARIO`, nunca de un parámetro.
  - Annotations MCP en todas las tools. Errores con código estable: los base de `core` más los del
    dominio en `src/errores.ts` de cada MCP.
  - Descripción en cuatro partes ("Qué hace:", "Cuándo usarla:", "Parámetros:" con un `ej.:`,
    "Qué NO hacer:"), verificada por el test de contrato. Tickets queda exceptuado por ahora.

  Flujo SDD: hub JKMate-Knowledge `procesos/flujo-specs.md`. Seguridad de agentes: skill
  `convenciones-jkmate:agent-safety-conventions`.

rules:
  design:
    - Por cada tool documentar el SP que la alimenta (existente o nuevo con script propuesto), inputSchema, outputSchema y un ejemplo de respuesta.
    - Marcar como "A CONFIRMAR" toda tabla/columna no verificada contra la base real de tickets.
  specs:
    - Escenarios en formato GIVEN/WHEN/THEN.
